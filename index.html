<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Свисток — футбольные новости</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root {
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-behavior: smooth; scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { margin: 0; background: #06090a; }

.fb-root {
  --bg-primary: #06090a;
  --accent-from: #00e58b;
  --accent-to: #d8f53b;
  --card-bg: rgba(255,255,255,0.045);
  --border: rgba(255,255,255,0.12);
  --text: #eef4f0;
  --muted: #8d9d95;
  --live: #ff4d5e;
  background: var(--bg-primary);
  color: var(--text);
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow-x: hidden;
  position: relative;
}
.fb-root *, .fb-root *::before, .fb-root *::after { box-sizing: border-box; }
.fb-root a { color: inherit; text-decoration: none; }
.fb-root button { font-family: inherit; cursor: pointer; }
.fb-root a:focus-visible, .fb-root button:focus-visible, .fb-root input:focus-visible {
  outline: 2px solid var(--accent-from); outline-offset: 3px;
}

.font-display { font-family: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif; }
.muted { color: var(--muted); }

/* ---------- Keyframes ---------- */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes floatBlob {
  0%   { transform: translate3d(0,0,0) scale(1); }
  50%  { transform: translate3d(40px,-50px,0) scale(1.12); }
  100% { transform: translate3d(-30px,30px,0) scale(0.95); }
}
@keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes livePulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,77,94,.6); }
  70%  { box-shadow: 0 0 0 10px rgba(255,77,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,77,94,0); }
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes glowPulse { 0%,100% { opacity: .55; } 50% { opacity: .95; } }
@keyframes spinSlow { to { transform: rotate(360deg); } }

.fiu { animation: fadeInUp .9s cubic-bezier(.2,.8,.2,1) both; }
.d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; }
.d4 { animation-delay: .55s; } .d5 { animation-delay: .7s; }

/* ---------- Scroll reveal ---------- */
.reveal {
  opacity: 0; transform: translateY(36px);
  transition: opacity .9s ease var(--d, 0ms), transform .9s cubic-bezier(.2,.8,.2,1) var(--d, 0ms);
}
.reveal.in { opacity: 1; transform: translateY(0); }

/* ---------- Surfaces ---------- */
.glass {
  background: var(--card-bg);
  border: 1px solid var(--border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 24px;
}
.grad-text {
  background: linear-gradient(100deg, var(--accent-from), var(--accent-to));
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.grad-bg { background: linear-gradient(120deg, var(--accent-from), var(--accent-to)); }
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-from), var(--accent-to), transparent);
  opacity: .7;
}

.card-hover {
  transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s, border-color .4s;
  will-change: transform;
}
.card-hover:hover {
  transform: scale(1.03) translateY(-4px);
  border-color: rgba(0,229,139,.6);
  box-shadow: 0 0 0 1px rgba(0,229,139,.2), 0 24px 70px -18px rgba(0,229,139,.45);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
  min-height: 48px; padding: 0 1.75rem; border-radius: 999px;
  font-weight: 700; font-size: .95rem; border: 1px solid transparent;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, background .3s, border-color .3s;
  white-space: nowrap;
}
.btn:hover { transform: scale(1.05); }
.btn-grad {
  color: #04140c;
  background: linear-gradient(120deg, var(--accent-from), var(--accent-to));
  box-shadow: 0 10px 30px -10px rgba(0,229,139,.6);
}
.btn-grad:hover { box-shadow: 0 0 0 4px rgba(0,229,139,.18), 0 14px 48px -6px rgba(0,229,139,.85); }
.btn-ghost {
  color: var(--text); background: rgba(255,255,255,.03); border-color: var(--border);
}
.btn-ghost:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.35); box-shadow: 0 0 36px -6px rgba(255,255,255,.25); }
.btn-dark { color: #fff; background: #04140c; }
.btn-dark:hover { box-shadow: 0 0 0 4px rgba(4,20,12,.25), 0 14px 40px -8px rgba(0,0,0,.6); }

/* ---------- Hero ---------- */
.h-mega {
  font-family: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  font-weight: 800; font-style: italic; text-transform: uppercase;
  font-size: clamp(3.6rem, 12vw, 8.5rem);
  line-height: .86; letter-spacing: -0.01em;
}
.h-section {
  font-family: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  font-weight: 800; text-transform: uppercase;
  font-size: clamp(2.4rem, 6vw, 4.4rem);
  line-height: .95; letter-spacing: -0.005em;
}
.blob {
  position: absolute; border-radius: 9999px; filter: blur(90px);
  animation: floatBlob 14s ease-in-out infinite alternate;
  pointer-events: none;
}
.pitch-lines { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .07; pointer-events: none; }
.hero-mask {
  -webkit-mask-image: radial-gradient(ellipse at 60% 40%, #000 20%, transparent 75%);
  mask-image: radial-gradient(ellipse at 60% 40%, #000 20%, transparent 75%);
}

.live-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--live); animation: livePulse 1.6s infinite; display: inline-block; }
.chip-float { animation: floatY 6s ease-in-out infinite; }

.marquee-track { display: flex; width: max-content; animation: marquee 38s linear infinite; }
.marquee-wrap:hover .marquee-track { animation-play-state: paused; }

/* ---------- Navbar ---------- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  transition: background .4s, backdrop-filter .4s, border-color .4s, padding .4s;
  border-bottom: 1px solid transparent;
}
.nav.scrolled {
  background: rgba(6,9,10,.72);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom-color: var(--border);
}
.nav-inner { height: 84px; transition: height .4s; }
.nav.scrolled .nav-inner { height: 68px; }
.nav-link { position: relative; color: var(--muted); font-weight: 600; font-size: .92rem; transition: color .25s; padding: .5rem 0; }
.nav-link::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
  background: linear-gradient(90deg, var(--accent-from), var(--accent-to));
  transform: scaleX(0); transform-origin: left; transition: transform .3s;
}
.nav-link:hover { color: #fff; }
.nav-link:hover::after { transform: scaleX(1); }

.icon-btn {
  width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  background: var(--card-bg); border: 1px solid var(--border); color: #fff;
}

.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  transition: opacity .4s; z-index: 60; opacity: 0; pointer-events: none;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 82%; max-width: 360px; z-index: 70;
  background: rgba(10,14,13,.96); border-left: 1px solid var(--border);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), visibility 0s linear .5s;
  padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
  transform: translateX(105%); visibility: hidden;
}
.drawer.open { transform: translateX(0); visibility: visible; transition-delay: 0s; }
.drawer-link {
  padding: 1rem 0; min-height: 56px; border-bottom: 1px solid var(--border);
  opacity: 0; transform: translateX(24px);
  transition: opacity .5s ease calc(150ms + var(--i, 0) * 70ms), transform .5s ease calc(150ms + var(--i, 0) * 70ms);
}
.drawer.open .drawer-link { opacity: 1; transform: translateX(0); }

/* ---------- Pricing ---------- */
.toggle-wrap { position: relative; display: inline-flex; padding: 5px; border-radius: 999px; background: var(--card-bg); border: 1px solid var(--border); }
.toggle-pill { position: absolute; top: 5px; bottom: 5px; border-radius: 999px; transition: left .4s cubic-bezier(.2,.8,.2,1), width .4s cubic-bezier(.2,.8,.2,1); }
.toggle-btn { position: relative; z-index: 1; min-height: 44px; padding: 0 1.4rem; background: transparent; border: 0; font-weight: 700; font-size: .92rem; transition: color .3s; display: inline-flex; align-items: center; gap: .5rem; }
.price-pop { border-color: rgba(0,229,139,.55) !important; box-shadow: 0 0 80px -20px rgba(0,229,139,.5); }
@media (min-width: 1024px) {
  .price-pop { transform: scale(1.05); }
  .price-pop:hover { transform: scale(1.08) translateY(-4px); }
}

/* ---------- FAQ ---------- */
.faq-body { display: grid; transition: grid-template-rows .45s cubic-bezier(.2,.8,.2,1); }
.faq-item { transition: border-color .3s, background .3s; border-radius: 20px; }
.faq-item.open { border-color: rgba(0,229,139,.45); background: rgba(0,229,139,.05); }
.faq-chev { flex-shrink: 0; color: var(--accent-from); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.faq-item.open .faq-chev { transform: rotate(180deg); }

/* ---------- Inputs ---------- */
.email-input {
  flex: 1; min-width: 0; min-height: 52px; padding: 0 1.25rem; border-radius: 999px;
  background: rgba(4,20,12,.12); border: 1px solid rgba(4,20,12,.35);
  color: #04140c; font-size: 1rem; font-family: inherit;
}
.email-input::placeholder { color: rgba(4,20,12,.6); }
.email-input.err { border-color: #b3001b; border-width: 2px; }

.scroll-x { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
@media (min-width: 768px) { #reviews .snap-center { min-width: 0 !important; } }

.social { width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--card-bg); transition: transform .3s, box-shadow .3s, border-color .3s, color .3s; color: var(--muted); }
.social:hover { transform: scale(1.1) translateY(-2px); color: #fff; border-color: rgba(0,229,139,.6); box-shadow: 0 0 28px -4px rgba(0,229,139,.6); }
.foot-link { color: var(--muted); font-size: .92rem; transition: color .25s; display: inline-block; padding: .35rem 0; }
.foot-link:hover { color: var(--accent-from); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .fb-root *, .fb-root *::before, .fb-root *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
</head>

  }

  function rings(side) {
    return '<svg viewBox="0 0 300 300" fill="none" stroke="#04140c" stroke-width="2" aria-hidden="true" style="position:absolute;top:50%;' + side +
      ':-90px;width:340px;height:340px;margin-top:-170px;opacity:.18;pointer-events:none;animation:spinSlow 60s linear infinite">' +
      '<circle cx="150" cy="150" r="140"/><circle cx="150" cy="150" r="95"/><circle cx="150" cy="150" r="50"/><line x1="150" y1="10" x2="150" y2="290"/></svg>';
  }

  function cta() {
    return '<section id="cta" class="px-6 py-12 md:py-20">' + reveal(
      '<div class="grad-bg relative mx-auto text-center px-6 py-16 md:py-24" style="max-width:1200px;border-radius:40px;overflow:hidden;color:#04140c">' +
        rings('left') + rings('right') +
        '<div class="relative" style="z-index:2">' +
          '<h2 class="h-section" style="font-size:clamp(2.6rem,7vw,5.2rem);max-width:800px;margin:0 auto">Следующий гол — в вашем почтовом ящике</h2>' +
          '<p class="mt-6 text-base md:text-lg mx-auto" style="max-width:520px;opacity:.8;line-height:1.6">Каждое утро — главные новости, итоги тура и инсайды дня. Без спама, отписаться можно в один клик.</p>' +
          '<div id="cta-form">' +
            '<div class="flex flex-col sm:flex-row gap-3 mt-10 mx-auto" style="max-width:520px">' +
              '<input type="email" id="cta-email" class="email-input" placeholder="Ваш e-mail" aria-label="Ваш e-mail">' +
              '<button class="btn btn-dark" id="cta-btn">' + icon('mail', 18) + ' Подписаться</button>' +
            '</div>' +
            '<p id="cta-error" class="mt-3 text-sm font-semibold" style="color:#7a0012;display:none">Проверьте адрес: он должен выглядеть как name@mail.com</p>' +
          '</div>' +
        '</div>' +
      '</div>');
  }

  function footer() {
    var socials = [['twitter', 'Twitter'], ['instagram', 'Instagram'], ['linkedin', 'LinkedIn'], ['github', 'GitHub']].map(function (s) {
      return '<a href="#top" class="social" aria-label="' + s[1] + '">' + icon(s[0], 18) + '</a>';
    }).join('');
    var groups = FOOTER_GROUPS.map(function (g) {
      return '<div><div class="font-bold mb-4">' + g.title + '</div><ul class="flex flex-col">' +
        g.links.map(function (l) { return '<li><a href="#top" class="foot-link">' + l + '</a></li>'; }).join('') + '</ul></div>';
    }).join('');
    return '<footer class="px-6 pt-20 pb-10" style="border-top:1px solid var(--border)"><div class="mx-auto" style="max-width:1200px">' +
      '<div class="grid lg:grid-cols-6 gap-12">' +
        '<div class="lg:col-span-2">' +
          '<a href="#top" class="flex items-center gap-3">' +
            '<span class="grad-bg flex items-center justify-center" style="width:40px;height:40px;border-radius:14px;color:#04140c">' + icon('radio', 22, { sw: 2.4 }) + '</span>' +
            '<span class="font-display text-2xl font-bold" style="letter-spacing:.02em">СВИСТОК</span></a>' +
          '<p class="muted mt-5 text-sm" style="max-width:320px;line-height:1.7">Футбольные новости, live-счёт и аналитика. Только проверенные факты и только то, что вам интересно.</p>' +
          '<div class="flex gap-3 mt-7">' + socials + '</div>' +
        '</div>' +
        '<div class="lg:col-span-4 grid grid-cols-2 md:grid-cols-4 gap-10">' + groups + '</div>' +
      '</div>' +
      '<div class="divider mt-16 mb-8" style="opacity:.3"></div>' +
      '<div class="flex flex-col md:flex-row justify-between gap-3 text-sm muted"><span>© 2026 Свисток. Все права защищены.</span><span>Сделано для тех, кто не пропускает матчи.</span></div>' +
    '</div></footer>';
  }

  /* ---------------- Render ---------------- */
  var app = document.getElementById('app');
  app.innerHTML = navbar() + hero() +
    '<main>' + features() + stats() + how() + testimonials() + pricing() + faq() + cta() + '</main>' + footer();

  /* ---------------- Behaviour ---------------- */
  // Navbar scroll state
  var nav = document.getElementById('nav');
  function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 50); }
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  // Drawer
  var drawer = document.getElementById('drawer');
  var overlay = document.getElementById('drawer-overlay');
  function setDrawer(open) {
    drawer.classList.toggle('open', open);
    overlay.classList.toggle('open', open);
    drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
  }
  document.getElementById('menu-open').addEventListener('click', function () { setDrawer(true); });
  document.getElementById('menu-close').addEventListener('click', function () { setDrawer(false); });
  overlay.addEventListener('click', function () { setDrawer(false); });
  Array.prototype.forEach.call(drawer.querySelectorAll('[data-close]'), function (a) {
    a.addEventListener('click', function () { setDrawer(false); });
  });

  // Scroll reveal
  var revealEls = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
  if ('IntersectionObserver' in window) {
    var rio = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); rio.unobserve(e.target); }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(function (el) { rio.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('in'); });
  }

  // Counters
  function runCounter(el) {
    var value = parseFloat(el.dataset.value), dec = parseInt(el.dataset.decimals, 10), suf = el.dataset.suffix;
    var start = Date.now(), dur = 2000;
    var id = setInterval(function () {
      var p = Math.min((Date.now() - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (value * eased).toFixed(dec) + suf;
      if (p >= 1) clearInterval(id);
    }, 16);
  }
  var counters = Array.prototype.slice.call(document.querySelectorAll('.counter'));
  if ('IntersectionObserver' in window) {
    var cio = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { runCounter(e.target); cio.unobserve(e.target); }
      });
    }, { threshold: 0.4 });
    counters.forEach(function (el) { cio.observe(el); });
  } else {
    counters.forEach(function (el) { el.textContent = el.dataset.value + el.dataset.suffix; });
  }

  // Live minute
  var minute = 67;
  var minEl = document.getElementById('live-min');
  var barEl = document.getElementById('live-bar');
  setInterval(function () {
    minute = minute >= 90 ? 60 : minute + 1;
    minEl.textContent = minute;
    barEl.style.width = (minute / 90 * 100) + '%';
  }, 2500);

  // Pricing toggle
  var pill = document.getElementById('toggle-pill');
  var tgMonth = document.getElementById('tg-month');
  var tgYear = document.getElementById('tg-year');
  var tgBadge = document.getElementById('tg-badge');
  var planWraps = document.querySelectorAll('.plan-wrap');
  function setBilling(yearly) {
    pill.style.left = yearly ? 'calc(50% + 0px)' : '5px';
    tgMonth.style.color = yearly ? 'var(--muted)' : '#04140c';
    tgYear.style.color = yearly ? '#04140c' : 'var(--muted)';
    tgBadge.style.background = yearly ? 'rgba(4,20,12,.15)' : 'rgba(0,229,139,.18)';
    tgBadge.style.color = yearly ? '#04140c' : 'var(--accent-from)';
    Array.prototype.forEach.call(planWraps, function (w, i) { w.innerHTML = planCard(PLANS[i], yearly); });
  }
  tgMonth.addEventListener('click', function () { setBilling(false); });
  tgYear.addEventListener('click', function () { setBilling(true); });

  // FAQ accordion
  var faqItems = Array.prototype.slice.call(document.querySelectorAll('.faq-item'));
  var openIdx = 0;
  function renderFaq() {
    faqItems.forEach(function (el, i) {
      var open = i === openIdx;
      el.classList.toggle('open', open);
      el.querySelector('.faq-btn').setAttribute('aria-expanded', open ? 'true' : 'false');
      el.querySelector('.faq-body').style.gridTemplateRows = open ? '1fr' : '0fr';
    });
  }
  faqItems.forEach(function (el, i) {
    el.querySelector('.faq-btn').addEventListener('click', function () {
      openIdx = openIdx === i ? -1 : i;
      renderFaq();
    });
  });
  renderFaq();

  // CTA subscribe
  var emailEl = document.getElementById('cta-email');
  var errEl = document.getElementById('cta-error');
  function submitEmail() {
    if (/^\S+@\S+\.\S+$/.test(emailEl.value)) {
      document.getElementById('cta-form').innerHTML =
        '<div class="mt-10 inline-flex items-center gap-3 font-bold" style="padding:14px 24px;border-radius:99px;background:#04140c;color:var(--accent-from)">' +
        icon('check', 20) + ' Готово! Проверьте почту — мы отправили подтверждение.</div>';
    } else {
      emailEl.classList.add('err');
      errEl.style.display = 'block';
    }
  }
  document.getElementById('cta-btn').addEventListener('click', submitEmail);
  emailEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitEmail(); });
  emailEl.addEventListener('input', function () { emailEl.classList.remove('err'); errEl.style.display = 'none'; });
})();
</script>
</body>
</html>
